<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <title>Rytho Yönetim</title>
  <link rel="icon" href="/assets/rytho_logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/rytho.css?v=4">
  <link rel="stylesheet" href="/rytho-admin/admin.css?v=4">
</head>
<body>
  <!-- Sitedeki canlı gökyüzü: starfield.js #yildizlar'ı bulur;
       prefers-reduced-motion'da tek statik kare çizer. -->
  <div class="gokyuzu" aria-hidden="true"><canvas id="yildizlar"></canvas></div>

  <a class="atla" href="#icerik">İçeriğe atla</a>
  <div id="rota-duyuru" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <div id="toast-kibar" class="toast-kap" role="status" aria-live="polite"></div>
  <div id="toast-acil" class="toast-kap acil" role="alert" aria-live="assertive"></div>

  <!-- Jenerik görünüm: yetkisiz herkese — panelin varlığını ele vermez. -->
  <div id="bulunamadi" class="orta" hidden>
    <div class="yildiz" aria-hidden="true">✦</div>
    <h1>Bu gökyüzünde böyle bir sayfa yok</h1>
    <a class="buton ikincil" href="/">Ana sayfa</a>
  </div>

  <!-- Giriş: sayfa hiçbir yerden linklenmez. -->
  <div id="giris" class="orta" hidden>
    <img src="/assets/rytho_logo.svg" alt="">
    <div class="giris-kart">
      <form id="eposta-form" class="giris-form">
        <label class="sr-only" for="giris-eposta">E-posta</label>
        <input class="girdi" id="giris-eposta" name="email" type="email" placeholder="E-posta"
               autocomplete="username" required>
        <label class="sr-only" for="giris-sifre">Şifre</label>
        <input class="girdi" id="giris-sifre" name="password" type="password" placeholder="Şifre"
               autocomplete="current-password" required>
        <button class="buton" type="submit">Giriş yap</button>
      </form>
      <div class="giris-ayrac"><span>ya da</span></div>
      <button id="google-gir" class="buton ikincil" type="button">Google ile devam et</button>
      <button id="sifre-unut" class="giris-unut" type="button">Şifreni mi unuttun?</button>
    </div>
    <p id="giris-hata" class="giris-mesaj hata" role="alert" hidden></p>
    <p id="giris-bilgi" class="giris-mesaj bilgi" role="status" hidden></p>
  </div>

  <!-- Panel kabuğu: 240px yan menü / 72px ray / <1080 çekmece -->
  <div id="uygulama" class="kabuk" hidden>
    <div class="perde" id="perde" aria-hidden="true"></div>
    <aside class="yan-menu" id="yan-menu" aria-label="Yan menü">
      <div class="marka">
        <img src="/assets/rytho_logo.svg" alt="">
        <div><b>Rytho</b><span>Yönetim</span></div>
      </div>
      <nav class="yan-nav" aria-label="Bölümler" id="yan-nav">
        <a href="#/genel" data-ikon="panel"><span class="etiket">Genel Bakış</span></a>
        <a href="#/kullanicilar" data-ikon="kullanicilar"><span class="etiket">Kullanıcılar</span></a>
        <a href="#/gelir" data-ikon="gelir"><span class="etiket">Gelir &amp; Abonelik</span></a>
        <a href="#/kullanim" data-ikon="ai"><span class="etiket">Kullanım &amp; AI</span></a>
        <a href="#/bildirimler" data-ikon="bildirim"><span class="etiket">Bildirimler</span></a>
        <a href="#/geribildirim" data-ikon="geribildirim"><span class="etiket">Geri bildirimler</span></a>
        <a href="#/ortaklar" data-ikon="ortaklar"><span class="etiket">Ortaklar</span></a>
        <a href="#/sistem" data-ikon="sistem"><span class="etiket">Sistem</span><span class="sayac" id="sistem-sayac"></span></a>
      </nav>
      <div class="yan-alt">
        <div class="durum-satir" id="backend-satir">
          <span class="durum-nokta" id="backend-nokta"></span>
          <span class="etiket" id="backend-durum">Sunucu</span>
        </div>
        <button id="cikis" class="cikis-dugme" type="button"><span class="etiket">Çıkış</span></button>
        <button id="daralt" class="daralt" type="button" aria-label="Menüyü daralt"><span class="etiket">Menüyü daralt</span></button>
      </div>
    </aside>

    <div class="ana">
      <header class="ust-cubuk">
        <button class="ust-ikon cekmece-ac" id="cekmece-ac" type="button" aria-label="Menü"
                aria-controls="yan-menu" aria-expanded="false"></button>
        <nav class="kirinti" id="kirinti" aria-label="Konum"></nav>
        <button class="palet" id="palet-ac" type="button" aria-label="Ara veya komut çalıştır (Ctrl K)">
          <span class="ikon" aria-hidden="true"></span>
          <span>Kullanıcı, sayfa ya da eylem ara…</span>
          <kbd aria-hidden="true">Ctrl K</kbd>
        </button>
        <div class="zil-kap">
          <button class="ust-ikon" id="zil" type="button" aria-label="Dikkat"
                  aria-haspopup="true" aria-expanded="false" aria-controls="zil-menu">
            <span class="rozet-sayac" id="zil-sayac"></span>
          </button>
          <div class="zil-menu" id="zil-menu" hidden>
            <div class="baslik">Dikkat</div>
            <div class="liste" id="zil-liste"></div>
          </div>
        </div>
        <div class="kimlik">
          <div class="avatar" id="admin-avatar" aria-hidden="true">?</div>
          <div class="kim">
            <span class="rol" id="admin-rol"></span>
            <span id="admin-eposta"></span>
          </div>
        </div>
      </header>
      <main id="icerik" class="icerik" tabindex="-1" aria-busy="false"></main>
    </div>
  </div>

  <!-- Firebase — Hosting'in rezerve SDK yolları (dış CDN yok) -->
  <script src="/__/firebase/10.12.2/firebase-app-compat.js"></script>
  <script src="/__/firebase/10.12.2/firebase-auth-compat.js"></script>
  <!-- App Check: identitytoolkit ZORLANIYOR (2026-09-26); jetonsuz giris
       reddediliyor. init.js'den ONCE yuklenmez, SONRA kurulur
       (/assets/ry-auth.js; OP9 oncesi bu is app.js icindeydi). -->
  <script src="/__/firebase/10.12.2/firebase-app-check-compat.js"></script>
  <script src="/__/firebase/init.js"></script>
  <script src="/assets/appcheck.js?v=1"></script>
  <!-- ORTAK modüller (OP9): kimlik kurulumu ve API katmanı ortak panosuyla
       (/affiliate/) AYNI dosyalar. Kopyalanmadı, paylaşıldı — iki kopya
       zamanla ayrışır ve içindeki acı dersler tek kopyada onarılır. -->
  <script src="/assets/ry-auth.js?v=1"></script>
  <script src="/assets/ry-api.js?v=2"></script>

  <script src="/assets/starfield.js"></script>
  <script src="/rytho-admin/ikonlar.js?v=3"></script>
  <!-- Tek Türkçe sözlük: görünümlerden ÖNCE (kodlar yalnız buradan ada çevrilir). -->
  <script src="/rytho-admin/sozluk.js?v=1"></script>
  <script src="/rytho-admin/bilesenler.js?v=4"></script>
  <script src="/rytho-admin/charts.js?v=4"></script>
  <script src="/rytho-admin/gorunumler/genel.js?v=4"></script>
  <script src="/rytho-admin/gorunumler/kullanicilar.js?v=4"></script>
  <script src="/rytho-admin/gorunumler/gelir.js?v=4"></script>
  <script src="/rytho-admin/gorunumler/kullanim.js?v=4"></script>
  <script src="/rytho-admin/gorunumler/bildirimler.js?v=4"></script>
  <script src="/rytho-admin/gorunumler/geribildirim.js?v=4"></script>
  <script src="/rytho-admin/gorunumler/ortaklar.js?v=4"></script>
  <script src="/rytho-admin/gorunumler/sistem.js?v=4"></script>
  <script src="/rytho-admin/app.js?v=4"></script>
</body>
</html>
