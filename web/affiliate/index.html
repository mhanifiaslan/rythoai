<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- noindex ikinci kemer; birincisi firebase.json /affiliate/** — docs/web-notlari.md §Ortak panosu -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <!-- Metinler data-i18n ile SOZLUK'tan dolar (tr/en) — docs/web-notlari.md §Ortak panosu -->
  <title data-i18n="sayfaBasligi">Rytho Ortak Panosu</title>
  <link rel="icon" href="/assets/rytho_logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="/assets/rytho.css?v=4">
  <link rel="stylesheet" href="/affiliate/ortak.css?v=2">
</head>
<body>
  <!-- Canlı gökyüzü; reduced-motion'da tek kare — docs/web-notlari.md §Ortak panosu -->
  <div class="gokyuzu" aria-hidden="true"><canvas id="yildizlar"></canvas></div>

  <!-- Atlama bağlantısı yalnız pano açıkken VAR — docs/web-notlari.md §Ortak panosu -->
  <a class="atla" id="atla-bag" href="#pano-govde" hidden data-i18n="atla">İçeriğe atla</a>
  <div id="duyuru" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <div id="toast-kap" class="toast-kap" role="status" aria-live="polite"></div>

  <!-- Jenerik görünüm: claim'siz HERKESE, erişimi ele vermez — docs/web-notlari.md §Ortak panosu -->
  <div id="bulunamadi" class="orta-ekran" hidden>
    <div class="yildiz" aria-hidden="true">✦</div>
    <h1 data-i18n="yokBaslik">Bu gökyüzünde böyle bir sayfa yok</h1>
    <a class="buton ikincil" href="/" data-i18n="kokSayfa">Ana sayfa</a>
  </div>

  <!-- Giriş: sayfa hiçbir yerden linklenmez. -->
  <div id="giris" class="orta-ekran" hidden>
    <img src="/assets/rytho_logo.svg" alt="">
    <div class="giris-kart">
      <h1 data-i18n="panoAdi">Ortak panosu</h1>
      <form id="eposta-form" class="giris-form">
        <label class="sr-only" for="giris-eposta" data-i18n="eposta">E-posta</label>
        <input class="girdi" id="giris-eposta" name="email" type="email" placeholder="E-posta"
               data-i18n-placeholder="eposta" autocomplete="username" required>
        <label class="sr-only" for="giris-sifre" data-i18n="sifre">Şifre</label>
        <input class="girdi" id="giris-sifre" name="password" type="password" placeholder="Şifre"
               data-i18n-placeholder="sifre" autocomplete="current-password" required>
        <button class="buton" type="submit" data-i18n="girisYap">Giriş yap</button>
      </form>
      <div class="giris-ayrac"><span data-i18n="yaDa">ya da</span></div>
      <button id="google-gir" class="buton ikincil" type="button" data-i18n="googleIle">Google ile devam et</button>
      <button id="sifre-unut" class="giris-unut" type="button" data-i18n="sifreUnut">Şifreni mi unuttun?</button>
    </div>
    <p id="giris-hata" class="giris-mesaj hata" role="alert" hidden></p>
    <p id="giris-bilgi" class="giris-mesaj bilgi" role="status" hidden></p>
  </div>

  <!-- Pano -->
  <!-- Kabuk yönetim panelinin küçük hâli: solda menü, sağda içerik — docs/web-notlari.md §Ortak panosu -->
  <div id="pano" class="pano-kabuk" hidden>
    <aside class="yan-menu">
      <div class="marka">
        <img src="/assets/rytho_logo.svg" alt="">
        <div><b>Rytho</b><span data-i18n="panoAdi">Ortak panosu</span></div>
      </div>
      <nav id="pano-menu" class="menu"></nav>
      <div class="menu-alt">
        <div class="dil-sec" role="group" aria-label="Language / Dil">
          <button type="button" data-dil="en" lang="en">EN</button>
          <button type="button" data-dil="tr" lang="tr">TR</button>
        </div>
        <button id="cikis" class="buton ikincil kucuk" type="button" data-i18n="cikis">Çıkış</button>
      </div>
    </aside>
    <div class="pano-sag">
      <header class="pano-ust">
        <span class="kim" id="kim-eposta"></span>
        <div class="bosluk"></div>
        <button id="yenile" class="buton ikincil kucuk" type="button" data-i18n="yenile">Yenile</button>
      </header>
      <main id="pano-govde" class="govde" tabindex="-1" aria-busy="true"></main>
    </div>
  </div>

  <!-- Firebase — Hosting'in rezerve SDK yolları (dış CDN yok) -->
  <script src="/__/firebase/10.12.2/firebase-app-compat.js"></script>
  <script src="/__/firebase/10.12.2/firebase-auth-compat.js"></script>
  <!-- App Check: identitytoolkit ZORLANIYOR; sıra docs/web-notlari.md §Ortak panosu -->
  <script src="/__/firebase/10.12.2/firebase-app-check-compat.js"></script>
  <script src="/__/firebase/init.js"></script>
  <script src="/assets/appcheck.js?v=1"></script>

  <!-- ORTAK modüller: yönetim paneliyle AYNI dosyalar (OP9). -->
  <script src="/assets/ry-auth.js?v=1"></script>
  <script src="/assets/ry-api.js?v=2"></script>

  <script src="/assets/starfield.js"></script>
  <script src="/affiliate/ortak.js?v=2"></script>
</body>
</html>
