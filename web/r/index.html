<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rytho — Ortak bağlantısı</title>
  <meta name="description" content="Rytho'yu indir.">
  <!-- noindex: /r/** tek sayfaya düşüyor, hepsi kopya içerik olurdu — docs/web-notlari.md §Ortak bağlantısı -->
  <meta name="robots" content="noindex, nofollow">

  <!-- Uygulama kuruluysa bu sayfa hiç açılmaz — docs/web-notlari.md §Ortak bağlantısı -->

  <meta property="og:title" content="Rytho — gökyüzünü senin için okuyor">
  <meta property="og:description"
        content="Gerçek gökyüzü hesabına dayanan günlük okuma.">
  <meta property="og:type" content="website">
  <link rel="icon" href="/assets/rytho_logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="/assets/rytho.css?v=4">

  <style>
    /* Sayfaya özel olan yalnız ortalanmış tek kart düzeni; renk, yazı tipi ve
       düğme ortak kabuktan gelir. */
    :root { color-scheme: dark; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    main { max-width: 420px; width: 100%; }
    .glyph { font-size: 56px; color: var(--gold); margin-bottom: 12px; }
    h1 { font-size: 28px; margin: 0 0 10px; }
    p { font-size: 15px; line-height: 1.55; color: var(--parchment-dim); margin: 0 0 20px; }
    main .buton { width: 100%; }
    /* 13 px taban ve ikincil metin rengi: eski not 12,5 px ve daha soluk bir gri (4,79:1) ile AA sınırındaydı. */
    .not { font-size: 13px; color: var(--parchment-dim); margin: 22px 0 0; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="gokyuzu"></div>
  <main>
    <div class="glyph">&#9790;</div>
    <h1 id="baslik">Rytho</h1>
    <p id="govde">Mağazaya yönlendiriliyorsun…</p>

    <!-- Kod kullanıcıya gösterilmez, bilinçli — docs/web-notlari.md §Ortak bağlantısı -->
    <a class="buton" id="magaza" href="https://play.google.com/store/apps/details?id=ai.rytho">Uygulamayı indir</a>
    <p class="not" id="not"></p>
  </main>

  <script>
  (function () {
    'use strict';

    // Kod biçimi backend'deki `_KOD_DESENI` ile BİREBİR aynı olmalı
    // (partner_service.py). Ayrışırsa sayfa geçerli bir kodu reddeder ya da
    // geçersiz birini mağazaya taşır.
    var DESEN = /^[A-Z0-9_-]{4,24}$/;
    var PAKET = 'ai.rytho';

    var METIN = {
      tr: {
        yonlendir: 'Mağazaya yönlendiriliyorsun…',
        indir: 'Uygulamayı indir',
        android: 'Kurulum bittiğinde bağlantı kendiliğinden tanınır; kod yazman gerekmez.',
        digerBaslik: 'Rytho',
        diger: 'Rytho Android için Google Play’de, şimdilik Türkiye’de. iOS sürümü hazırlanıyor.',
        digerNot: 'Ortak bağlantısı şimdilik yalnız Android kurulumlarında sayılıyor.',
        gecersiz: 'Bu bağlantı geçerli değil.',
        gecersizGovde: 'Ortak kodu okunamadı. Uygulamayı yine de indirebilirsin.'
      },
      en: {
        yonlendir: 'Taking you to the store…',
        indir: 'Get the app',
        android: 'The link is recognised automatically after install — nothing to type.',
        digerBaslik: 'Rytho',
        diger: 'Rytho is on Google Play for Android, in Turkey for now. The iOS version is on the way.',
        digerNot: 'Partner links currently count for Android installs only.',
        gecersiz: 'This link is not valid.',
        gecersizGovde: "We couldn't read the partner code. You can still download the app."
      }
    };

    var dil = (navigator.language || 'tr').toLowerCase().indexOf('tr') === 0
      ? 'tr' : 'en';
    var t = METIN[dil];
    document.documentElement.lang = dil;

    function el(id) { return document.getElementById(id); }

    /* ---- Tıklama pingi: huninin TEPESİ ---- */

    /* NEDEN var: bu ping olmadan ortak yalnız KURAN kullanıcıyı görüyor.
       Linkini 500 kişiye gönderip 3 kurulum alan ortak, işe yaramayanın
       tanıtımı mı, bağlantısı mı, yoksa mağaza sayfası mı olduğunu
       ayırt edemiyordu — dönüşüm oranının BÖLENİ tam burada üretiliyor.

       ⚠️ Sayılan şey TIKLAMA, KİŞİ DEĞİL. Sayfa `noindex, nofollow`
       taşıyor ama robots yönergesi WhatsApp/X gibi bağlantı önizleme
       çekicilerini DURDURMAZ; onlar robots'a bakmadan sayfayı çeker.
       Ping JS ile atıldığı için JS koşturmayan önizleyiciler sayıya
       girmez, ama koşturan biri girer. Bu yüzden panolardaki etiket
       "tıklama" der: "kişi" demek ölçülmeyeni beyan etmek olurdu.

       Kimlik YOK: gövdede yalnız kod gider. Sunucu ne IP, ne User-Agent,
       ne çerez, ne ziyaretçi kimliği YAZAR — artan tek şey gün başına bir
       sayaç (bekçi: `test_tiklama_kaydinda_KISISEL_VERI_yok`).

       ⚠️ İddia bilerek "yazmıyor", "okumuyor" DEĞİL: iki yerde okunan bir
       şey var. `sendBeacon`'un çerez davranışı KAPATILAMAZ, yani çerez
       varsa istekle gider; kota kovası da isteğin IP'sini BELLEKTE
       anahtar yapıyor (`core/ratelimit.py`). İkisi de hiçbir yere
       yazılmıyor — panolardaki metin de bu yüzden "saklanmıyor" der. */
    function tiklamaBildir(kod) {
      // Aynı sekmede yenileme çift saymasın. ⚠️ `sessionStorage` ERİŞİMDE
      // fırlatabilir (gizli sekme, site verisi kapalı) — sarmalanmazsa
      // fonksiyon düşer, yönlendirme hiç çağrılmaz ve ziyaretçi mağazaya
      // GİTMEZ. Sayaç uğruna kurulum kaybetmek en kötü sonuç, o yüzden
      // depolama yoksa dedup'tan vazgeçilir (en kötüsü bir yenileme iki
      // tıklama sayılır).
      var anahtar = 'rytho_r_ping_' + kod;
      try {
        if (sessionStorage.getItem(anahtar)) return;
        sessionStorage.setItem(anahtar, '1');
      } catch (h) { /* depolama yok: dedup'suz devam */ }

      // Göreli adres BİLİNÇLİ: firebase.json `/api/**`i aynı kökende
      // Cloud Run'a yeniden yazıyor. Ana makine sabit yazılsaydı sayfa
      // rhytoai.web.app üstünden açıldığında çapraz kökene düşer ve
      // beacon'un yapamadığı bir ön-uçuş gerekirdi.
      var adres = '/api/v1/partners/click';
      var govde = JSON.stringify({ code: kod });

      // ⚠️ SIRA ÖLÜMCÜL: Android dalı hemen `location.replace` çağırıyor
      // ve sıradan bir `fetch` o anda İPTAL EDİLİR — ölçüm sessizce
      // kaybolur, hata da görünmez. `sendBeacon` tam bunun için var:
      // isteği tarayıcıya devreder, sayfa kapansa bile gönderilir.
      // Blob tipi AÇIKÇA veriliyor: verilmezse beacon gövdeyi `text/plain`
      // diye yollar. ⚠️ Uç BUGÜN onu da yutuyor — gövdeyi Pydantic modeli
      // yerine elle ayrıştırıyor (`api/partners.py`, gerekçesi tam bu),
      // yani "tip verilmezse 422" DOĞRU DEĞİL. Tip, ucun o esnekliğine bel
      // bağlamamak için veriliyor: uca bir gün model konursa `text/plain`
      // gövde 422'ye düşer ve sayaç sessizce ölür (beacon yanıtı okunmaz).
      try {
        if (navigator.sendBeacon) {
          var paket = new Blob([govde], { type: 'application/json' });
          // `false` dönebilir (kuyruk sınırı): sessizce kabul etmek
          // ölçümü kaybetmek olurdu, o yüzden yedeğe düşülür.
          if (navigator.sendBeacon(adres, paket)) return;
        }
      } catch (h2) { /* Blob/sendBeacon yok ya da reddetti: yedek */ }

      // Yedek zincirin ikinci halkası: `keepalive` isteği sayfa
      // yıkılırken de sürdürür — bu bayrak olmadan yönlendirme isteği
      // keser. `credentials: 'omit'` burada MÜMKÜN (beacon'da değil).
      try {
        if (typeof fetch === 'function') {
          fetch(adres, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: govde,
            keepalive: true,
            credentials: 'omit'
          }).catch(function () { /* ölçüm isteği: sessiz düşer */ });
        }
      } catch (h3) { /* ikisi de yoksa ping ATLANIR */ }

      // Üçüncü halka YOK ve bu bilinçli: senkron XHR ölçümü kurtarırdı
      // ama yönlendirmeyi geciktirir. Ziyaretçi mağazaya gitmeyi bir
      // sayaç için BEKLEMEZ — eksik ölçüm kabul, geciken kurulum değil.
    }

    // Kod yolun İKİNCİ parçasında: /r/ORTAK10
    var parcalar = location.pathname.split('/').filter(Boolean);
    var kod = (parcalar[1] || '').toUpperCase();
    var gecerli = DESEN.test(kod);

    var android = /Android/.test(navigator.userAgent);

    // Play'e utm_* biçiminde gönderiliyor. Serbest bir dize de işe yarardı
    // ama utm ile Play Console'un kendi edinme raporları ortak başına
    // performansı BEDAVA gösteriyor; uygulama yalnız utm_campaign'i okuyor.
    var magaza = 'https://play.google.com/store/apps/details?id=' + PAKET;
    if (gecerli) {
      var referrer = 'utm_source=rytho_partner&utm_medium=affiliate'
        + '&utm_campaign=' + encodeURIComponent(kod);
      magaza += '&referrer=' + encodeURIComponent(referrer);
    }
    el('magaza').setAttribute('href', magaza);
    el('magaza').textContent = t.indir;

    if (!gecerli) {
      // Geçersiz kodda ping ATILMAZ. ⚠️ Gerekçe "çöp doküman" DEĞİL: uç
      // hem biçimi hem kodun gerçekten var olduğunu kendisi doğruluyor
      // (`partner_service.record_click`; biçim kapısı bir OKUMAYA bile mal
      // olmuyor), yani yazım hiç oluşmazdı. Sebep daha basit: sayfa kodun
      // kullanılamaz olduğunu BİLİYOR — mağaza bağlantısına referrer de
      // eklenmedi — ve bilerek reddedilecek istek atmak yalnız kimliksiz
      // ucun kotasını boşa yakar.
      el('baslik').textContent = t.gecersiz;
      el('govde').textContent = t.gecersizGovde;
      return;
    }

    // Ping platformdan BAĞIMSIZ, çünkü tıklama tıklamadır. iOS ve
    // masaüstü tıklaması atfa DÖNÜŞEMEZ (Install Referrer dengi yok) ve
    // ortağın bunu görmesi işine yarıyor: 500 tıklama / 0 kurulum,
    // kitlesinin iPhone'da olduğunu söyler. Bu yüzden panolarda dönüşüm
    // oranının bölenine iOS tıklamalarının da girdiği YAZILI.
    tiklamaBildir(kod);

    if (android) {
      // Kod mağaza bağlantısında taşınıyor: kullanıcı hiçbir şey yapmıyor.
      el('govde').textContent = t.yonlendir;
      el('not').textContent = t.android;
      location.replace(magaza);
      return;
    }

    // iOS ve masaüstü: Play Install Referrer'ın dengi YOK ve uygulamada
    // kod girme alanı da yok — yani bu kod BURADAN hiçbir yere taşınamaz.
    // Sayfa bunu saklamıyor: mağaza bağlantısı duruyor, atfın sayılmadığı
    // açıkça yazılıyor. (iOS tarafı App Store Custom Product Page + derin
    // bağlantıyla çözülecek; o kurulduğunda bu dal oraya yönlenir.)
    el('baslik').textContent = t.digerBaslik;
    el('govde').textContent = t.diger;
    el('not').textContent = t.digerNot;
  })();
  </script>
</body>
</html>
