<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rytho — Davet</title>
  <meta name="description" content="Rytho'da seni bekleyen bir davet var.">
  <!-- noindex: /i/** tek sayfaya düşüyor, hepsi kopya içerik olurdu — docs/web-notlari.md §Davet -->
  <meta name="robots" content="noindex, nofollow">
  <!-- Uygulama kuruluysa bu sayfa hiç açılmaz (App Links) — docs/web-notlari.md §Davet -->
  <meta property="og:title" content="Rytho — bir davetin var">
  <meta property="og:description"
        content="Gercek gokyuzu hesabina dayanan gunluk okuma. Arkadasin seni ekledi.">
  <meta property="og:type" content="website">
  <link rel="icon" href="/assets/rytho_logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="/assets/rytho.css?v=3">
  <style>
    /* Sayfaya özel olan yalnız ortalanmış tek kart düzeni; renk, yazı tipi ve
       düğme ortak kabuktan gelir. */
    :root { color-scheme: dark; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    main { max-width: 420px; width: 100%; }
    .glyph { font-size: 56px; color: var(--gold); margin-bottom: 12px; }
    h1 { font-size: 28px; margin: 0 0 10px; }
    p { color: var(--parchment-dim); line-height: 1.6; margin: 0 0 28px; font-size: 15px; }
    .username { color: var(--gold); font-weight: 600; }
    main .buton { width: 100%; }
    /* 13 px taban ve ikincil metin rengi: eski not 12 px'ti ve zeminde 3,97:1 ölçüldü (AA eşiği 4,5). */
    .not { font-size: 13px; color: var(--parchment-dim); margin: 22px 0 0; }
    .dil { margin-top: 24px; }
  </style>
</head>
<body>
  <div class="gokyuzu"></div>
  <main>
    <div class="glyph" aria-hidden="true">✦</div>
    <h1 id="baslik">Rytho'da bir davetin var</h1>
    <p>
      <span class="username" id="username"></span>
      <span id="govde">seni arkadaş olarak ekledi. Daveti kabul etmek için
        uygulamayı aç.</span>
    </p>

    <!-- Tek mağaza düğmesi; App Store düğmesi hiçbir yere gitmediği için kaldırıldı — docs/web-notlari.md §Davet -->
    <a class="buton" id="play"
       href="https://play.google.com/store/apps/details?id=ai.rytho">
      Google Play'den indir
    </a>

    <p class="not" id="not">
      Uygulama zaten kuruluysa bu bağlantı doğrudan Rytho'da açılır.
    </p>
    <div class="dil"><a class="dil-sec" id="dil" href="?lang=en">EN</a></div>
  </main>

  <script>
    'use strict';

    // ---- Dil: hesap işlemi sayfasıyla AYNI desen.
    //
    // Bu sayfa yalnizca uygulama KURULU DEGILKEN aciliyor, yani yeni
    // testcinin gordugu ilk yuzey; tek dilli kalirsa Ingilizce telefondaki
    // davetli tamamen Turkce bir karsilama goruyor.
    //
    // Asil sinyal `navigator.language`: davet baglantisi (`inviteLinkFor`)
    // bilerek `?lang=` TASIMIYOR, cunku GONDERENIN dili alicinin dili
    // degil. `?lang=` elle QA icin ve asagidaki dil pili icin okunuyor —
    // otomatik secim yanlis dustugunde ziyaretcinin bir cikisi olsun.
    var params = new URLSearchParams(window.location.search);
    var lang = (params.get('lang') || navigator.language || 'tr')
      .toLowerCase().slice(0, 2);
    if (lang !== 'en') lang = 'tr';
    document.documentElement.lang = lang;

    var T = {
      tr: {
        pageTitle: 'Rytho — Davet',
        baslik: 'Rytho\'da bir davetin var',
        govde: 'seni arkadaş olarak ekledi. Daveti kabul etmek için uygulamayı aç.',
        anonim: 'Bir arkadaşın',
        magaza: 'Google Play\'den indir',
        not: 'Uygulama zaten kuruluysa bu bağlantı doğrudan Rytho\'da açılır.',
        dil: 'EN',
        dilHref: '?lang=en'
      },
      en: {
        pageTitle: 'Rytho — Invitation',
        baslik: 'You have an invitation on Rytho',
        govde: 'added you as a friend. Open the app to accept the invitation.',
        anonim: 'A friend of yours',
        magaza: 'Get it on Google Play',
        not: 'If the app is already installed, this link opens straight in Rytho.',
        dil: 'TR',
        dilHref: '?lang=tr'
      }
    }[lang];

    document.title = T.pageTitle;
    document.getElementById('baslik').textContent = T.baslik;
    document.getElementById('govde').textContent = T.govde;
    document.getElementById('play').textContent = T.magaza;
    document.getElementById('not').textContent = T.not;
    var dil = document.getElementById('dil');
    dil.textContent = T.dil;
    dil.setAttribute('href', T.dilHref);

    // Kullanici adi yoldan okunur: /i/gezgin
    var parcalar = window.location.pathname.split('/').filter(Boolean);
    var kullanici = parcalar.length > 1 ? decodeURIComponent(parcalar[1]) : '';
    document.getElementById('username').textContent =
      kullanici ? '@' + kullanici : T.anonim;
  </script>
</body>
</html>
