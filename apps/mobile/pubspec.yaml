name: rytho
description: "RythoAI - Kisisel Kozmik Zeka Platformu"
publish_to: 'none'
# Play yÃ¼klemeleri: versionCode (+N) her yÃ¼klemede artmalÄ±, benzersizdir.
version: 1.19.0+49

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # Ã‡ok dillilik (TR + EN)
  flutter_localizations:
    sdk: flutter

  # Durum yÃ¶netimi
  flutter_riverpod: ^3.0.3

  # AÄŸ
  dio: ^5.9.0

  # Firebase
  firebase_core: ^4.4.0
  # App Check (GK-turu, 2026-09-15): Firebase Auth ucu internete acik ve
  # anahtar kisitlamasi zayif kalir cunku SHA-1 parmak izimiz assetlinks.json
  # ile ZATEN yayinda. Bot ciftligi bunu kullanip 39 hesap acti. App Check,
  # isteklerin GERCEK uygulamadan geldigini Play Integrity ile kanitlar.
  firebase_app_check: ^0.4.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.1.2
  firebase_messaging: ^16.1.0
  # CihazÄ±n IANA saat dilimi ("Europe/Istanbul"). Bildirimin kullanÄ±cÄ±nÄ±n
  # sabahÄ±na denk gelmesi iÃ§in sunucunun buna ihtiyacÄ± var; DateTime'Ä±n
  # dÃ¶ndÃ¼rdÃ¼ÄŸÃ¼ kÄ±saltmalar ("+03") sunucuda Ã§Ã¶zÃ¼lemiyor.
  flutter_timezone: ^5.1.0
  firebase_crashlytics: ^5.0.7
  firebase_analytics: ^12.0.4
  google_sign_in: ^7.2.0

  # UI
  google_fonts: ^6.3.2
  flutter_animate: ^4.5.2

  # Abonelik (RevenueCat)
  purchases_flutter: ^9.10.4

  # YÃ¼z okuma â€” CIHAZ USTU.
  #
  # Fotograf sunucuya GITMEZ ve saklanmaz: kare bellekte islenir, oranlar
  # cikarilir, kare atilir. Sunucuya yalnizca turetilmis sayilar gider.
  # Bu bir gizlilik tercihi oldugu kadar bir dogruluk tercihi: ekranda yuze
  # oturan noktalar gercek tespit sonucudur, animasyon icin uydurulmus
  # degil.
  #
  # `camera` canli onizleme icin gerekli â€” `image_picker` sistem kamerasini
  # aciyor ve uzerine cerceveleme kilavuzu cizilemiyor.
  camera: ^0.11.2
  google_mlkit_face_detection: ^0.13.1

  # Profil fotoÄŸrafÄ± yÃ¼kleme (U1): avatars/{uid} â€” kurallar infra/storage.rules.
  firebase_storage: ^13.0.5

  # AraÃ§lar
  # Zorunlu gÃ¼ncelleme kapÄ±sÄ± (F3): buildNumber'Ä± sunucu eÅŸiÄŸiyle
  # karÅŸÄ±laÅŸtÄ±rmak iÃ§in.
  package_info_plus: ^10.2.1
  image_picker: ^1.2.1
  intl: ^0.20.2
  # Play abonelik yÃ¶netimi sayfasÄ± (Abonelik ekranÄ±ndaki "AboneliÄŸi yÃ¶net").
  url_launcher: ^6.3.1
  audioplayers: ^6.8.1
  shared_preferences: ^2.5.5
  # Uygulama ON PLANDAYKEN gelen bildirimi gostermek icin. Android'de FCM'in
  # `notification` yuku yalnizca uygulama arka plandayken sistem tepsisinde
  # gorunur; on planda `onMessage`'a teslim edilir ve gostermek uygulamanin
  # isidir. Ayrica yuksek oncelikli bildirim kanalini bu paket tanimliyor.
  flutter_local_notifications: ^22.2.0
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  app_links: ^7.2.1
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.7
  # Rehber eslesmesi (R3): numaralar CIHAZDA hash'lenir, sunucuya
  # yalnizca SHA-256 listesi gider. Ayar varsayilan KAPALI.
  flutter_contacts: ^1.1.9+2
  # Sac cizgisi olcumu icin CIHAZ USTU segmentasyon (bkz.
  # features/face/face_segmentation.dart). Model dosyasi assets altinda ve
  # Apache 2.0; goruntu telefondan cikmiyor.
  tflite_flutter: ^0.12.0
  # Ortaklık atfı (OP): ortak bağlantısıyla gelen kurulumda Play, koda
  # sahip `referrer` dizesini uygulamaya verir — kullanıcı hiçbir şey
  # yazmaz. ANDROID'E ÖZEL ve bilinçli: iOS'ta dengi yok, orada çözüm
  # App Store Custom Product Page + derin bağlantı olacak.
  # Üçüncü parti atıf SDK'sı (Branch vb.) alınmadı; gerekçe
  # lib/core/partner_referrer.dart başlığında.
  play_install_referrer: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Uygulama ikonu uretimi (Revize R7). Kaynak assets/icon/*.png;
  # yeniden uretmek icin: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  # ARB dosyalarÄ±ndan AppLocalizations Ã¼retimi (bkz. l10n.yaml)
  generate: true

  assets:
    - assets/sounds/
    # Kehanet bekleme sahneleri (PBZ): animasyonlu WebP kare dizileri —
    # widgets/frame_sequence.dart dart:ui codec'iyle surer, video eklentisi yok.
    # Butce: klip <=1 MB, toplam <=5 MB (test/anim_assets_test.dart zorlar).
    - assets/anim/
    # Åehir + Ã¼lke dizinleri (O1): GeoNames'ten build_gazetteer.py Ã¼retir.
    # CC-BY 4.0 â€” atÄ±f hukuk sayfasÄ±nda.
    - assets/data/
    # Marka: giris basligindaki logo (Revize R7). SVG kaynak olarak repoda
    # duruyor, pakete yalnizca PNG giriyor.
    - assets/brand/rytho_logo_512.png
    # MediaPipe Selfie Multiclass â€” 6 sinif (arka plan, sac, govde-teni,
    # yuz-teni, giysi, aksesuar). Sac cizgisini bundan cikariyoruz.
    # Lisans: Apache 2.0 (model karti, Google, 10 Mayis 2023).
    - assets/models/selfie_multiclass_256x256.tflite
    # Yazi tipleri PAKETTE (tools/font_paketi_uret.py uretir). Eskiden yalniz
    # GoogleFonts.* ile acilista fonts.gstatic.com'dan iniyordu: agsiz
    # acilista yedek font flasi, ilk acilista Google'a ag cagrisi. Dosya adi
    # google_fonts paketinin aradigi `<Aile>-<Agirlik>.ttf` kalibinda OLMAK
    # ZORUNDA (google_fonts_variant.dart:181-184); baska ad sessizce
    # bulunamaz ve allowRuntimeFetching=false ile FIRLATIR. Agirlik kumesi
    # olculdu (RythoText cagrilari, ucluler dahil): Sora 600/700,
    # Manrope 400/500/600/700, JetBrains Mono 400/700. Dosyalar tek tek
    # listelenir ki yanindaki .codepoints.txt (bekci kapsam listesi) pakete
    # GIRMESIN. Lisans: OFL — docs/legal/fonts/. Butce <=1 MB
    # (test/font_paketi_test.dart).
    - assets/google_fonts/Sora-SemiBold.ttf
    - assets/google_fonts/Sora-Bold.ttf
    - assets/google_fonts/Manrope-Regular.ttf
    - assets/google_fonts/Manrope-Medium.ttf
    - assets/google_fonts/Manrope-SemiBold.ttf
    - assets/google_fonts/Manrope-Bold.ttf
    - assets/google_fonts/JetBrainsMono-Regular.ttf
    - assets/google_fonts/JetBrainsMono-Bold.ttf

  # Astrolojik glif fontu (lib/theme/rytho_glyphs.dart): Noto Sans Symbols +
  # Symbols 2'den yalniz gereken kod noktalari (7 KB). Her RythoText stili bu
  # aileyi fontFamilyFallback'te tasir; boylece ana fontta olmayan glif
  # Android'in emoji fontuna degil buraya duser.
  fonts:
    - family: RythoGlyphs
      fonts:
        - asset: assets/fonts/RythoGlyphs.ttf

# Uygulama ikonu (Revize R7). Kaynak PNG'ler assets/icon/ altinda; SVG asli
# assets/brand/rytho_logo.svg. Zemin rengi RythoColors.ink (#0B0710).
# Uretim: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0B0710"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  # Android 13+ temali ikon: ayni beyaz sekiller, sistem renklendirir.
  adaptive_icon_monochrome: "assets/icon/app_icon_foreground.png"
  # iOS ikonunda saydamlik Apple tarafindan reddedilir.
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#0B0710"
    theme_color: "#0B0710"
